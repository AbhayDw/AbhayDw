name: Sync Profile Projects

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  sync-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Project Synchronization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_projects.py

      - name: Commit and Push Changes If Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected in portfolio projects. Working tree clean."
          else
            git commit -m "chore(sync): update portfolio projects from GitHub activity [skip ci]"
            git push
          fi
