<svg width="100%" height="20" viewBox="0 0 940 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hairline background rule that blends nicely on both dark and light modes -->
  <line x1="0" y1="10" x2="940" y2="10" stroke="#333D4B" stroke-width="1" stroke-dasharray="3 3" />
  
  <!-- Left accent anchor -->
  <rect x="0" y="8" width="18" height="4" fill="#D97706" rx="1" />
  
  <!-- Center architectural diamond & measurement crosshair -->
  <g transform="translate(470, 10)">
    <line x1="-140" y1="0" x2="-25" y2="0" stroke="#2B6CB0" stroke-width="1.5" />
    <line x1="25" y1="0" x2="140" y2="0" stroke="#2B6CB0" stroke-width="1.5" />
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#D97706" />
    <circle cx="-14" cy="0" r="2.5" fill="#2B6CB0" />
    <circle cx="14" cy="0" r="2.5" fill="#2B6CB0" />
    <line x1="0" y1="-9" x2="0" y2="-7" stroke="#D97706" stroke-width="1.5" />
    <line x1="0" y1="7" x2="0" y2="9" stroke="#D97706" stroke-width="1.5" />
  </g>
  
  <!-- Right accent anchor -->
  <rect x="922" y="8" width="18" height="4" fill="#2B6CB0" rx="1" />
</svg>
